  <style>
    :root {

      --amber: #f59e0b;
      --blue: #3b82f6;
      --teal: #14b8a6;
      --emerald: #10b981;
      --crimson: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg) radial-gradient(circle at 50% 0%, rgba(59,130,246,0.12), transparent 50%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.2rem;
      min-height: 100vh;
    }
    .wrapper { max-width: 760px; margin: 0 auto; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0 1.4rem; }
    .brand { font-size: 1.3rem; font-weight: 800; color: #fff; text-decoration: none; }
    .brand span { color: var(--amber); }
    .home-link {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      color: #fff; border-radius: 12px; padding: 0.55rem 0.9rem;
      font-size: 0.85rem; font-weight: 700; text-decoration: none;
    }

    .hero-tag { font-size: 0.72rem; font-weight: 800; letter-spacing: 1.5px; color: var(--amber); text-transform: uppercase; margin-bottom: 0.3rem; }
    .hero-h1 { font-size: 2.1rem; font-weight: 800; margin-bottom: 0.4rem; letter-spacing: -0.5px; }
    .hero-p { color: var(--muted); font-size: 0.9rem; line-height: 1.45; margin-bottom: 1.4rem; }

    /* Category Filter Pills */
    .cat-scroll {
      display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.6rem; margin-bottom: 1.2rem;
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 999px; padding: 0.45rem 0.9rem; font-size: 0.76rem; font-weight: 700;
      color: var(--muted); white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .cat-pill.active { background: rgba(59,130,246,0.18); border-color: var(--blue); color: #93c5fd; }

    /* Map Grid Layout */
    .map-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1.2rem; align-items: start; }
    @media(max-width: 680px) { .map-grid { grid-template-columns: 1fr; } }

    .map-stage {
      position: relative; background: #0c1220; border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden; padding: 0.5rem;
      display: flex; justify-content: center; align-items: center;
    }
    .map-svg { width: 100%; height: auto; max-height: 480px; display: block; }

    /* Interactive Pins */
    .map-pin { cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .map-pin:hover { transform: scale(1.35); }
    .map-pin circle {
      fill: #1d4ed8; stroke: #ffffff; stroke-width: 2.5; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
    }
    .map-pin text {
      font-size: 14px; font-weight: 900; fill: #ffffff; text-anchor: middle; dominant-baseline: central;
      pointer-events: none;
    }
    .map-pin.correct circle { fill: #10b981 !important; filter: drop-shadow(0 0 12px #10b981) !important; }
    .map-pin.wrong circle { fill: #ef4444 !important; filter: drop-shadow(0 0 12px #ef4444) !important; }

    /* Control Column */
    .control-col { display: flex; flex-direction: column; gap: 0.75rem; }
    .q-cat { font-size: 0.72rem; font-weight: 800; color: var(--amber); letter-spacing: 1px; text-transform: uppercase; }
    .q-title { font-size: 1.1rem; font-weight: 800; color: #fff; line-height: 1.35; }
    .q-clue { font-size: 0.84rem; color: var(--muted); line-height: 1.4; }

    .opt-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.3rem; }
    .opt-btn {
      width: 100%; padding: 0.75rem 1rem; border-radius: 12px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      color: #fff; font-size: 0.86rem; font-weight: 600; text-align: left;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between;
    }
    .opt-btn:hover { background: rgba(255,255,255,0.08); }
    .opt-btn.correct { background: rgba(16,185,129,0.2) !important; border-color: var(--emerald) !important; color: #6ee7b7; }
    .opt-btn.wrong { background: rgba(239,68,68,0.2) !important; border-color: var(--crimson) !important; color: #fca5a5; }

    .feedback-box { padding: 0.9rem; border-radius: 12px; font-size: 0.84rem; display: none; line-height: 1.45; }
    .next-btn {
      width: 100%; padding: 0.8rem; border-radius: 12px; font-size: 0.88rem; font-weight: 700;
      background: var(--amber); color: #000; border: none; cursor: pointer; display: none; margin-top: 0.3rem;
    }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2.5rem 0 1rem; border-top: 1px solid var(--border); margin-top: 2.5rem; }
  </style>
</head>

    /* 3. ZERO-REPEAT DECK & SCRAMBLE CONTROLLER */
    let unplayedDeck = [];
    let currentCategory = 'ALL';
    let currentQ = null;
    let score = 0;
    let totalAnswered = 0;
    let activeMapping = {};

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initDeck(cat) {
      currentCategory = cat;
      const pool = cat === 'ALL' ? QUESTIONS : QUESTIONS.filter(q => q[0] === cat);
      unplayedDeck = shuffle([...pool]);
    }

    function setCategory(cat, btn) {
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      initDeck(cat);
      loadQuestion();
    }

    function loadQuestion() {
      // Auto-reshuffle only when all questions in category have been answered
      if (unplayedDeck.length === 0) {
        initDeck(currentCategory);
      }

      // Pop next question (guarantees zero repetition)
      currentQ = unplayedDeck.pop();

      const correctKey = currentQ[4];
      const correctLoc = COORDS[correctKey];

      // Pick 3 random, distinct distractors
      const otherKeys = Object.keys(COORDS).filter(k => k !== correctKey);
      shuffle(otherKeys);
      const distractors = otherKeys.slice(0, 3);

      // Scramble option positions across A, B, C, D
      const roundOptions = [
        { key: correctKey, name: correctLoc[0], x: correctLoc[1], y: correctLoc[2], isCorrect: true },
        { key: distractors[0], name: COORDS[distractors[0]][0], x: COORDS[distractors[0]][1], y: COORDS[distractors[0]][2], isCorrect: false },
        { key: distractors[1], name: COORDS[distractors[1]][0], x: COORDS[distractors[1]][1], y: COORDS[distractors[1]][2], isCorrect: false },
        { key: distractors[2], name: COORDS[distractors[2]][0], x: COORDS[distractors[2]][1], y: COORDS[distractors[2]][2], isCorrect: false }
      ];
      shuffle(roundOptions);

      activeMapping = {
        A: roundOptions[0],
        B: roundOptions[1],
        C: roundOptions[2],
        D: roundOptions[3]
      };

      // Update question text and scoreboard
      document.getElementById('qCatLabel').innerText = `${currentQ[1]} (${unplayedDeck.length} remaining)`;
      document.getElementById('qScoreLabel').innerText = `Score: ${score} / ${totalAnswered}`;
      document.getElementById('qTitle').innerText = currentQ[2];
      document.getElementById('qClue').innerText = "Clue: " + currentQ[3];
      document.getElementById('feedbackBox').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';

      // Reposition SVG pins and update buttons
      ['A', 'B', 'C', 'D'].forEach(letter => {
        const item = activeMapping[letter];
        const gPin = document.getElementById('pin' + letter);
        const circle = gPin.querySelector('circle');
        const text = gPin.querySelector('text');

        circle.setAttribute('cx', item.x);
        circle.setAttribute('cy', item.y);
        text.setAttribute('x', item.x);
        text.setAttribute('y', item.y);

        gPin.className.baseVal = "map-pin";

        const btn = document.getElementById('btn' + letter);
        document.getElementById('label' + letter).innerText = item.name;
        btn.className = "opt-btn";
        btn.disabled = false;
      });
    }

    function checkChoice(choice) {
      totalAnswered++;
      const chosen = activeMapping[choice];
      const fbBox = document.getElementById('feedbackBox');

      let correctLetter = 'A';
      ['A', 'B', 'C', 'D'].forEach(letter => {
        if (activeMapping[letter].isCorrect) correctLetter = letter;
        document.getElementById('btn' + letter).disabled = true;
      });

      const chosenPin = document.getElementById('pin' + choice);
      const correctPin = document.getElementById('pin' + correctLetter);

      if (chosen.isCorrect) {
        score++;
        chosenPin.className.baseVal = "map-pin correct";
        document.getElementById('btn' + choice).classList.add('correct');
        fbBox.innerHTML = `<strong>✓ Correct!</strong> You accurately located <strong>${chosen.name}</strong>.<br>${currentQ[5]}`;
        fbBox.style.background = "rgba(16,185,129,0.18)";
        fbBox.style.color = "#6ee7b7";
      } else {
        chosenPin.className.baseVal = "map-pin wrong";
        correctPin.className.baseVal = "map-pin correct";
        document.getElementById('btn' + choice).classList.add('wrong');
        document.getElementById('btn' + correctLetter).classList.add('correct');
        fbBox.innerHTML = `<strong>✗ Incorrect.</strong> You picked Pin ${choice} (${chosen.name}).<br>The correct position is <strong>Pin ${correctLetter} (${activeMapping[correctLetter].name})</strong>.<br>${currentQ[5]}`;
        fbBox.style.background = "rgba(239,68,68,0.18)";
        fbBox.style.color = "#fca5a5";
      }

      document.getElementById('qScoreLabel').innerText = `Score: ${score} / ${totalAnswered}`;
      fbBox.style.display = 'block';
      document.getElementById('nextBtn').style.display = 'block';
    }

    function nextRound() {
      loadQuestion();
    }

    // Initialize Map on Load
    initDeck('ALL');
    loadQuestion();
  </script>
