<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBSE Class 10 Map Practice Arena</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: linear-gradient(135deg, rgba(16, 24, 40, 0.95) 0%, rgba(20, 32, 54, 0.85) 100%);
      --border: rgba(255, 255, 255, 0.1);
      --amber: #f59e0b;
      --blue: #3b82f6;
      --emerald: #10b981;
      --rose: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0.8rem;
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Top Return Bar (Aligned to Right) */
    .top-nav-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    .btn-return-arena {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      z-index: 50;
      transition: all 0.2s ease;
    }
    .btn-return-arena:hover,
    .btn-return-arena:active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: var(--blue);
    }

    /* Primary Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.35rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 0.6rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem 0.5rem;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
        /* Sub Tabs (Geography Chapters) */
    .sub-tabs-container {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      padding-bottom: 0.4rem;
      margin-bottom: 0.8rem;
      scrollbar-width: none;
    }
    .sub-tabs-container::-webkit-scrollbar { display: none; }
    .sub-tab-btn {
      flex-shrink: 0;
      padding: 0.45rem 0.75rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sub-tab-btn.active {
      background: rgba(245, 158, 11, 0.18);
      border-color: var(--amber);
      color: var(--amber);
    }

    /* Quiz Card Container */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.1rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    /* 1. Map Display Frame (Top of Card) */
    .map-frame {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #061126;
      margin-bottom: 1rem;
    }
    .map-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* Compact 18px Pin Markers */
    .map-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background: #ef4444;
      color: #ffffff;
      font-size: 0.62rem;
      font-weight: 900;
      line-height: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.9), 0 0 10px rgba(239, 68, 68, 0.4);
      border: 1.5px solid #ffffff;
      animation: pulsePin 1.8s infinite;
      z-index: 10;
    }
    @keyframes pulsePin {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
        /* 2. Question Metadata & Text Under Map */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .q-tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .score-badge {
      font-size: 0.74rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      color: #cbd5e1;
    }
    .q-title {
      font-size: 0.98rem;
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 0.35rem;
      color: #fff;
    }
    .pyq-badge {
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.78rem;
      margin-bottom: 0.9rem;
      display: block;
      letter-spacing: 0.2px;
    }

    /* 3. Options Grid Under Question */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 480px) {
      .options-grid { grid-template-columns: 1fr; }
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: #e2e8f0;
      padding: 0.8rem 0.9rem;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .option-btn:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--blue);
    }
    .option-btn.correct {
      background: rgba(16, 185, 129, 0.22) !important;
      border-color: var(--emerald) !important;
      color: #34d399 !important;
    }
    .option-btn.wrong {
      background: rgba(244, 63, 94, 0.22) !important;
      border-color: var(--rose) !important;
      color: #fb7185 !important;
    }

    .feedback-box {
      display: none;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.84rem;
      line-height: 1.45;
      margin-bottom: 1rem;
    }

    /* Control Bar */
    .control-bar {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .ctrl-btn {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-prev { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; }
    .btn-restart {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .btn-restart:hover { background: rgba(239, 68, 68, 0.25); }
    .btn-next { background: var(--amber); color: #000; flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Top-Right Back Navigation Bar -->
    <div class="top-nav-bar">
      <a href="activity.html" class="btn-return-arena">← Back to Arena</a>
    </div>

    <!-- Top Navigation Tabs -->
    <div class="nav-tabs">
      <button type="button" class="tab-btn active" onclick="switchMainTab('all', this)">🗺️ All Maps</button>
      <button type="button" class="tab-btn" onclick="switchMainTab('history', this)">📜 History (Ch 2)</button>
      <button type="button" class="tab-btn" onclick="switchMainTab('geography', this)">🌍 Geography</button>
    </div>

    <!-- Geography Chapter Sub-Tabs -->
    <div class="sub-tabs-container" id="geoSubTabs" style="display: none;">
      <button type="button" class="sub-tab-btn active" onclick="switchGeoSubTab('all', this)">All Geography</button>
      <button type="button" class="sub-tab-btn" onclick="switchGeoSubTab('ch3', this)">Ch 3: Dams</button>
      <button type="button" class="sub-tab-btn" onclick="switchGeoSubTab('ch5', this)">Ch 5: Minerals & Energy</button>
      <button type="button" class="sub-tab-btn" onclick="switchGeoSubTab('ch6', this)">Ch 6: Industries</button>
      <button type="button" class="sub-tab-btn" onclick="switchGeoSubTab('ch7', this)">Ch 7: Ports & Airports</button>
    </div>

    <!-- Single Quiz Card Structure -->
    <div class="quiz-card">
      
      <!-- 1. MAP AT TOP -->
      <div class="map-frame">
        <img src="india-map.png" alt="India Political Map" class="map-img">
        <div id="pinsContainer"></div>
      </div>

      <!-- 2. QUESTION & CBSE PYQ TAG UNDER MAP -->
      <div class="q-meta">
        <span class="q-tag" id="categoryTag">CBSE Class 10 Map Practice</span>
        <span class="score-badge" id="counterBadge">Question 1 of 1</span>
      </div>

      <h2 class="q-title" id="questionTitle">Loading practice question...</h2>
      <p class="pyq-badge" id="pyqTag"></p>

      <!-- 3. OPTIONS DIRECTLY UNDER QUESTION -->
      <div class="options-grid" id="optionsGrid"></div>

      <!-- 4. FEEDBACK BOX -->
      <div class="feedback-box" id="feedbackBox"></div>

      <!-- 5. BOTTOM CONTROLS -->
      <div class="control-bar">
        <button type="button" class="ctrl-btn btn-prev" onclick="prevQuestion()">← Prev</button>
        <button type="button" class="ctrl-btn btn-restart" onclick="restartQuiz()">🔄 Restart</button>
        <button type="button" class="ctrl-btn btn-next" id="nextBtn" onclick="nextQuestion()">Next →</button>
      </div>

    </div>

  </div>

  <script>
          let currentMainFilter = "all";
    let currentGeoSubFilter = "all";
    let activeQuestionList = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    // Fisher-Yates Randomizer: Guarantees exact 1/4 (25%) probability for Pin A, B, C, D
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function applyFilters() {
      if (currentMainFilter === "all") {
        activeQuestionList = [...ALL_QUESTIONS];
      } else if (currentMainFilter === "history") {
        activeQuestionList = ALL_QUESTIONS.filter(q => q.main === "history");
      } else if (currentMainFilter === "geography") {
        if (currentGeoSubFilter === "all") {
          activeQuestionList = ALL_QUESTIONS.filter(q => q.main === "geography");
        } else {
          activeQuestionList = ALL_QUESTIONS.filter(q => q.main === "geography" && q.sub === currentGeoSubFilter);
        }
      }
      currentIndex = 0;
      score = 0;
      loadQuestion(0);
    }

    function switchMainTab(filterName, btnEl) {
      currentMainFilter = filterName;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");
      document.getElementById("geoSubTabs").style.display = (filterName === "geography") ? "flex" : "none";
      applyFilters();
    }

    function switchGeoSubTab(subName, btnEl) {
      currentGeoSubFilter = subName;
      document.querySelectorAll(".sub-tab-btn").forEach(b => b.classList.remove("active"));
      btnEl.classList.add("active");
      applyFilters();
    }
        function loadQuestion(index) {
      answered = false;
      const q = activeQuestionList[index];
      document.getElementById("categoryTag").textContent = q.tag;
      document.getElementById("counterBadge").textContent = `Q ${index + 1} of ${activeQuestionList.length} • Score: ${score}`;
      
      // Question text without location spoilers
      document.getElementById("questionTitle").textContent = q.title;

      // CBSE PYQ Tag under question as a separate paragraph
      const pyqEl = document.getElementById("pyqTag");
      if (q.pyq && q.pyq.trim() !== "") {
        pyqEl.textContent = `[CBSE ${q.pyq}]`;
        pyqEl.style.display = "block";
      } else {
        pyqEl.textContent = "";
        pyqEl.style.display = "none";
      }

      // Shuffle pins to give exact 1/4 (25%) probability to Pin A, B, C, D
      const shuffledPins = shuffleArray([...q.pins]);
      let correctIndex = -1;
      const labels = ["A", "B", "C", "D"];
      const pinsContainer = document.getElementById("pinsContainer");
      pinsContainer.innerHTML = "";

      shuffledPins.forEach((pin, idx) => {
        const letter = labels[idx];
        if (pin.isTarget) correctIndex = idx;
        const p = document.createElement("div");
        p.className = "map-pin";
        p.style.top = pin.top;
        p.style.left = pin.left;
        p.textContent = letter;
        pinsContainer.appendChild(p);
      });

      const optionsGrid = document.getElementById("optionsGrid");
      optionsGrid.innerHTML = "";
      labels.forEach((letter, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = `Pin ${letter}`;
        btn.onclick = () => selectOption(btn, idx, correctIndex, q.explanation);
        optionsGrid.appendChild(btn);
      });

      document.getElementById("feedbackBox").style.display = "none";
    }

    function selectOption(btn, chosenIdx, correctIdx, explanation) {
      if (answered) return;
      answered = true;
      const fb = document.getElementById("feedbackBox");
      const allButtons = document.querySelectorAll(".option-btn");
      if (chosenIdx === correctIdx) {
        score++;
        btn.classList.add("correct");
        fb.style.display = "block";
        fb.style.background = "rgba(16, 185, 129, 0.15)";
        fb.style.border = "1px solid rgba(16, 185, 129, 0.35)";
        fb.style.color = "#34d399";
        fb.innerHTML = `<strong>Correct! ✓</strong> ${explanation}`;
      } else {
        btn.classList.add("wrong");
        allButtons[correctIdx].classList.add("correct");
        fb.style.display = "block";
        fb.style.background = "rgba(244, 63, 94, 0.15)";
        fb.style.border = "1px solid rgba(244, 63, 94, 0.35)";
        fb.style.color = "#fb7185";
        fb.innerHTML = `<strong>Incorrect. ✕</strong> ${explanation}`;
      }
      document.getElementById("counterBadge").textContent = `Q ${currentIndex + 1} of ${activeQuestionList.length} • Score: ${score}`;
    }

    function nextQuestion() {
      if (currentIndex < activeQuestionList.length - 1) {
        currentIndex++;
        loadQuestion(currentIndex);
      } else {
        alert(`Completed! Final Score: ${score} / ${activeQuestionList.length}`);
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        loadQuestion(currentIndex);
      }
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      loadQuestion(0);
    }

    const ALL_QUESTIONS = [
          // --- HISTORY: NATIONALISM IN INDIA (PART 1) ---

      {

            // --- HISTORY (DANDI) & DAMS (1 TO 7) ---
      {

      },
      {

        pyq: "2015, 2017, 2019, 2022, 2024",

        ],
        explanation: "Sardar Sarovar Dam — Gujarat (Narmada River)."
      },
      {

        tag: "Water Resources • Dams",
        title: "Locate and label Bhakra Nangal Dam.",
        pyq: "2015, 2018, 2020, 2023",
        pins: [
          { top: "25.7%", left: "31.7%", isTarget: true }, // Bhakra-Nangal
          { top: "21.2%", left: "27.2%" }, // Salal
          { top: "30.6%", left: "37.7%" }, // Tehri
          { top: "56.0%", left: "21.9%" }  // Sardar Sarovar
        ],
        explanation: "Bhakra Nangal Dam — Himachal Pradesh / Punjab border (Satluj River)."
      },
      {
